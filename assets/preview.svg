<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .header-bar { fill: #1e293b; }
      .dot-red { fill: #ef4444; }
      .dot-yellow { fill: #f59e0b; }
      .dot-green { fill: #10b981; }
      .txt { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, "Courier New", monospace; font-size: 13.5px; }
      .title { fill: #94a3b8; font-weight: 600; font-size: 13px; }
      .c-cyan { fill: #38bdf8; font-weight: bold; }
      .c-green { fill: #4ade80; font-weight: bold; }
      .c-yellow { fill: #facc15; font-weight: bold; }
      .c-magenta { fill: #c084fc; font-weight: bold; }
      .c-gray { fill: #64748b; }
      .c-white { fill: #f8fafc; }
      .c-bold { font-weight: bold; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="850" height="510" class="bg" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window Header -->
  <path d="M0,12 C0,5.37 5.37,0 12,0 L838,0 C844.63,0 850,5.37 850,12 L850,38 L0,38 Z" class="header-bar" />
  <circle cx="22" cy="19" r="6" class="dot-red" />
  <circle cx="42" cy="19" r="6" class="dot-yellow" />
  <circle cx="62" cy="19" r="6" class="dot-green" />
  <text x="425" y="24" text-anchor="middle" class="txt title">Qwen 2.5 Coder 7B - Live Terminal Dashboard</text>

  <!-- Terminal Content -->
  <g transform="translate(30, 64)" class="txt">
    <!-- Box Top -->
    <text y="0" class="c-cyan">┌──────────────────────────────────────────────────────────────────────────────┐</text>
    
    <!-- Title -->
    <text y="22" class="c-cyan">│</text>
    <text x="145" y="22" class="c-cyan">⚡ QWEN 2.5 CODER 7B (LLAMA-SERVER DASHBOARD) ⚡</text>
    <text x="765" y="22" class="c-cyan">│</text>
    
    <!-- Divider 1 -->
    <text y="42" class="c-cyan">├──────────────────────────────────────────────────────────────────────────────┤</text>
    
    <!-- Server Status -->
    <text y="62" class="c-cyan">│</text>
    <text x="15" y="62" class="c-white c-bold">Server Status:</text>
    <text x="145" y="62" class="c-green">● READY (IDLE)</text>
    <text x="480" y="62" class="c-white c-bold">Uptime:</text>
    <text x="545" y="62" class="c-white">08:24</text>
    <text x="765" y="62" class="c-cyan">│</text>

    <!-- Model -->
    <text y="82" class="c-cyan">│</text>
    <text x="15" y="82" class="c-white c-bold">Model:</text>
    <text x="145" y="82" class="c-cyan">Qwen 2.5 Coder 7B Instruct (Q4_K_M)</text>
    <text x="765" y="82" class="c-cyan">│</text>

    <!-- API -->
    <text y="102" class="c-cyan">│</text>
    <text x="15" y="102" class="c-white c-bold">API Endpoint:</text>
    <text x="145" y="102" class="c-green">http://127.0.0.1:8080/v1</text>
    <text x="765" y="102" class="c-cyan">│</text>

    <!-- Config -->
    <text y="122" class="c-cyan">│</text>
    <text x="15" y="122" class="c-white c-bold">Configuration:</text>
    <text x="145" y="122" class="c-white">65,536 tokens  |  Cache: Q8_0  |  Flash-Attn: ON</text>
    <text x="765" y="122" class="c-cyan">│</text>

    <!-- Divider 2 -->
    <text y="142" class="c-cyan">├──────────────────────────────────────────────────────────────────────────────┤</text>

    <!-- Memory Header -->
    <text y="162" class="c-cyan">│</text>
    <text x="15" y="162" class="c-white c-bold">📊 VRAM &amp; SYSTEM RAM METRICS:</text>
    <text x="765" y="162" class="c-cyan">│</text>

    <!-- VRAM Bar -->
    <text y="182" class="c-cyan">│</text>
    <text x="25" y="182" class="c-white">├─ 🎮 <tspan class="c-bold">GPU Memory (VRAM):</tspan></text>
    <text x="235" y="182" class="c-cyan">██████████████</text>
    <text x="347" y="182" class="c-yellow">█████</text>
    <text x="387" y="182" class="c-gray">░░░</text>
    <text x="420" y="182" class="c-white">7.80 / 8.0 GB (97.5%)</text>
    <text x="765" y="182" class="c-cyan">│</text>

    <!-- VRAM Legend -->
    <text y="202" class="c-cyan">│</text>
    <text x="50" y="202" class="c-cyan">■ Model:</text>
    <text x="115" y="202" class="c-white">5.56 GB</text>
    <text x="180" y="202" class="c-gray">|</text>
    <text x="195" y="202" class="c-yellow">■ Windows/System:</text>
    <text x="340" y="202" class="c-white">2.24 GB</text>
    <text x="765" y="202" class="c-cyan">│</text>

    <!-- RAM Spillover -->
    <text y="222" class="c-cyan">│</text>
    <text x="25" y="222" class="c-white">├─ 🧠 <tspan class="c-bold">CPU RAM Spillover:</tspan></text>
    <text x="235" y="222" class="c-green">0.00 GB  [✅ 100% IN VRAM, NO OFFLOAD]</text>
    <text x="765" y="222" class="c-cyan">│</text>

    <!-- Server RAM -->
    <text y="242" class="c-cyan">│</text>
    <text x="25" y="242" class="c-white">├─ ⚙️  <tspan class="c-bold">Server RAM (llama):</tspan></text>
    <text x="235" y="242" class="c-white">~5.24 GB (Vulkan host buffer)</text>
    <text x="765" y="242" class="c-cyan">│</text>

    <!-- Dashboard RAM -->
    <text y="262" class="c-cyan">│</text>
    <text x="25" y="262" class="c-white">└─ 🐍 <tspan class="c-bold">Dashboard RAM (Py):</tspan></text>
    <text x="235" y="262" class="c-green">30.4 MB</text>
    <text x="300" y="262" class="c-white">(lightweight UI monitor)</text>
    <text x="765" y="262" class="c-cyan">│</text>

    <!-- Divider 3 -->
    <text y="282" class="c-cyan">├──────────────────────────────────────────────────────────────────────────────┤</text>

    <!-- Context & Speed -->
    <text y="302" class="c-cyan">│</text>
    <text x="15" y="302" class="c-white c-bold">📈 CONTEXT ACTIVITY &amp; THROUGHPUT:</text>
    <text x="765" y="302" class="c-cyan">│</text>

    <text y="322" class="c-cyan">│</text>
    <text x="25" y="322" class="c-white">├─ 🗂  <tspan class="c-bold">Context Occupied:</tspan></text>
    <text x="235" y="322" class="c-green">████</text>
    <text x="267" y="322" class="c-gray">░░░░░░░░░░░░░░░░</text>
    <text x="420" y="322" class="c-white">12,291 / 65,536 (18.8%)</text>
    <text x="765" y="322" class="c-cyan">│</text>

    <text y="342" class="c-cyan">│</text>
    <text x="25" y="342" class="c-white">└─ ⚡ <tspan class="c-bold">Response Speed:</tspan></text>
    <text x="235" y="342" class="c-white">Generation:</text>
    <text x="320" y="342" class="c-green c-bold">43.8 tok/s</text>
    <text x="405" y="342" class="c-gray">|</text>
    <text x="420" y="342" class="c-white">Prompt:</text>
    <text x="480" y="342" class="c-cyan c-bold">146.2 tok/s</text>
    <text x="765" y="342" class="c-cyan">│</text>

    <!-- Divider 4 -->
    <text y="362" class="c-cyan">├──────────────────────────────────────────────────────────────────────────────┤</text>

    <!-- Logs -->
    <text y="382" class="c-cyan">│</text>
    <text x="15" y="382" class="c-white c-bold">📜 LIVE SERVER EVENT LOGS:</text>
    <text x="765" y="382" class="c-cyan">│</text>

    <text y="400" class="c-cyan">│</text>
    <text x="25" y="400" class="c-gray">&gt; HTTP server listening on http://127.0.0.1:8080</text>
    <text x="765" y="400" class="c-cyan">│</text>

    <text y="416" class="c-cyan">│</text>
    <text x="25" y="416" class="c-gray">&gt; slot 0 | task 359 | prompt processing: 146.19 tokens per second</text>
    <text x="765" y="416" class="c-cyan">│</text>

    <!-- Box Bottom -->
    <text y="432" class="c-cyan">└──────────────────────────────────────────────────────────────────────────────┘</text>
  </g>
</svg>