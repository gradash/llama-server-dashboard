<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .header-bar { fill: #1e293b; }
      .dot-red { fill: #ef4444; }
      .dot-yellow { fill: #f59e0b; }
      .dot-green { fill: #10b981; }
      .txt { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, "Courier New", monospace; font-size: 13.5px; }
      .title { fill: #94a3b8; font-weight: 600; font-size: 13px; }
      .c-cyan { fill: #38bdf8; font-weight: bold; }
      .c-green { fill: #4ade80; font-weight: bold; }
      .c-yellow { fill: #facc15; font-weight: bold; }
      .c-magenta { fill: #c084fc; font-weight: bold; }
      .c-gray { fill: #64748b; }
      .c-white { fill: #f8fafc; }
      .c-label { fill: #f8fafc; font-weight: bold; }
      .c-dim { fill: #94a3b8; }
      .frame { fill: #0b1329; stroke: #0284c7; stroke-width: 1.5; rx: 6px; }
      .div-line { stroke: #0284c7; stroke-width: 1; opacity: 0.85; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="850" height="510" class="bg" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window Header Bar -->
  <path d="M0,12 C0,5.37 5.37,0 12,0 L838,0 C844.63,0 850,5.37 850,12 L850,38 L0,38 Z" class="header-bar" />
  <circle cx="22" cy="19" r="6" class="dot-red" />
  <circle cx="42" cy="19" r="6" class="dot-yellow" />
  <circle cx="62" cy="19" r="6" class="dot-green" />
  <text x="425" y="24" text-anchor="middle" class="txt title">Qwen 2.5 Coder 7B - Live Terminal Dashboard</text>

  <!-- Inner Terminal Frame -->
  <g transform="translate(30, 58)" class="txt">
    <!-- Box Frame (Pure Vector Rect - Immune to font mismatch) -->
    <rect width="790" height="424" class="frame" />
    
    <!-- Header Title -->
    <text x="395" y="24" text-anchor="middle" class="c-cyan">⚡ QWEN 2.5 CODER 7B (LLAMA-SERVER DASHBOARD) ⚡</text>
    <line x1="0" y1="36" x2="790" y2="36" class="div-line" />

    <!-- Section 1: Server Info -->
    <text x="20" y="58" class="c-label">Server Status:</text>
    <text x="145" y="58" class="c-green">● READY (IDLE)</text>
    <text x="560" y="58" class="c-label">Uptime:</text>
    <text x="625" y="58" class="c-white">08:24</text>

    <text x="20" y="79" class="c-label">Model:</text>
    <text x="145" y="79" class="c-cyan">Qwen 2.5 Coder 7B Instruct (Q4_K_M)</text>

    <text x="20" y="100" class="c-label">API Endpoint:</text>
    <text x="145" y="100" class="c-green">http://127.0.0.1:8080/v1</text>

    <text x="20" y="121" class="c-label">Configuration:</text>
    <text x="145" y="121" class="c-white">65,536 tokens  |  Cache: Q8_0  |  Flash-Attn: ON</text>

    <line x1="0" y1="134" x2="790" y2="134" class="div-line" />

    <!-- Section 2: VRAM & RAM -->
    <text x="20" y="156" class="c-label">📊 VRAM &amp; SYSTEM RAM METRICS:</text>
    
    <!-- VRAM Bar -->
    <text x="35" y="178" class="c-white">├─ 🎮 <tspan class="c-label">GPU Memory (VRAM):</tspan></text>
    <!-- Vector Stacked Bar -->
    <g transform="translate(235, 166)">
      <rect width="180" height="14" rx="2" fill="#334155" />
      <rect width="125" height="14" rx="2" fill="#38bdf8" />
      <rect x="125" width="48" height="14" fill="#facc15" />
    </g>
    <text x="430" y="178" class="c-white">7.80 / 8.0 GB (97.5%)</text>

    <!-- VRAM Sub-legend -->
    <text x="60" y="198" class="c-cyan">■ Model:</text>
    <text x="125" y="198" class="c-white">5.56 GB</text>
    <text x="190" y="198" class="c-gray">|</text>
    <text x="205" y="198" class="c-yellow">■ Windows/System:</text>
    <text x="350" y="198" class="c-white">2.24 GB</text>

    <text x="35" y="219" class="c-white">├─ 🧠 <tspan class="c-label">CPU RAM Spillover:</tspan></text>
    <text x="235" y="219" class="c-green">0.00 GB  [✅ 100% IN VRAM, NO OFFLOAD]</text>

    <text x="35" y="240" class="c-white">├─ ⚙️  <tspan class="c-label">Server RAM (llama):</tspan></text>
    <text x="235" y="240" class="c-white">~5.24 GB (Vulkan host buffer)</text>

    <text x="35" y="261" class="c-white">└─ 🐍 <tspan class="c-label">Dashboard RAM (Py):</tspan></text>
    <text x="235" y="261" class="c-green">30.4 MB</text>
    <text x="298" y="261" class="c-dim">(lightweight UI monitor)</text>

    <line x1="0" y1="274" x2="790" y2="274" class="div-line" />

    <!-- Section 3: Context & Throughput -->
    <text x="20" y="296" class="c-label">📈 CONTEXT ACTIVITY &amp; THROUGHPUT:</text>
    
    <text x="35" y="318" class="c-white">├─ 🗂  <tspan class="c-label">Context Occupied:</tspan></text>
    <!-- Context Vector Bar -->
    <g transform="translate(235, 306)">
      <rect width="180" height="14" rx="2" fill="#334155" />
      <rect width="34" height="14" rx="2" fill="#4ade80" />
    </g>
    <text x="430" y="318" class="c-white">12,291 / 65,536 (18.8%)</text>

    <text x="35" y="340" class="c-white">└─ ⚡ <tspan class="c-label">Response Speed:</tspan></text>
    <text x="235" y="340" class="c-white">Generation: <tspan class="c-green">43.8 tok/s</tspan>  <tspan class="c-gray">|</tspan>  Prompt: <tspan class="c-cyan">146.2 tok/s</tspan></text>

    <line x1="0" y1="354" x2="790" y2="354" class="div-line" />

    <!-- Section 4: Live Event Logs -->
    <text x="20" y="376" class="c-label">📜 LIVE SERVER EVENT LOGS:</text>
    <text x="35" y="396" class="c-gray">&gt; HTTP server listening on http://127.0.0.1:8080</text>
    <text x="35" y="413" class="c-gray">&gt; slot 0 | task 359 | prompt processing: 146.19 tokens per second</text>
  </g>
</svg>